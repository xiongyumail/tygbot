# Copy to secrets.yaml and replace every placeholder with your own values.
# Generate a fresh API key with: openssl rand -base64 32
tygbot_api_key: "REPLACE_WITH_YOUR_32_BYTE_BASE64_KEY"
tygbot_ota_password: "REPLACE_WITH_YOUR_OTA_PASSWORD"
tygbot_fallback_password: "REPLACE_WITH_YOUR_FALLBACK_PASSWORD"

# Optional: referenced only if you add STA credentials under wifi:.
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"
