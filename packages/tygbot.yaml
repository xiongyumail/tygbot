substitutions:
  device_name: tygbot
  device_friendly_name: TYGBot
  repository_ref: v1.1.0

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  project:
    name: xiongyu.tygbot
    version: "1.1.0"
  compile_process_limit: 2

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: INFO

debug:
  update_interval: 10s

# Credential-free: builds the public firmware. Private configs add the API key,
# OTA password and AP password on top of this package.
api:
  encryption: {}
  reboot_timeout: 0s

ota:
  - platform: esphome

safe_mode:

wifi:
  # Omit STA credentials to retain Wi-Fi provisioned into flash.
  reboot_timeout: 0s
  # Roaming scans after connecting allocate scan results and leave the channel; with the
  # door TLS and Bluetooth proxy running they drove free heap down to about 4 KB.
  post_connect_roaming: false
  ap:
    ssid: ${device_name}-setup
  # Bluetooth scanning shares the radio; keep it off while the hotspot may be in use.
  on_connect:
    - esp32_ble_tracker.start_scan:
        continuous: true
  on_disconnect:
    - esp32_ble_tracker.stop_scan:

captive_portal:

improv_serial:
  next_url: http://{{ip_address}}/

esp32_improv:
  authorizer: none
  next_url: http://{{ip_address}}/

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true
    continuous: false

bluetooth_proxy:
  active: true

mdns:

dashboard_import:
  package_import_url: github://xiongyumail/tygbot/packages/tygbot.yaml@${repository_ref}

time:
  - platform: sntp
    id: tygbot_time
    timezone: Asia/Shanghai
    servers:
      - ntp.aliyun.com
      - pool.ntp.org

external_components:
  - source:
      type: git
      url: https://github.com/xiongyumail/tygbot
      ref: ${repository_ref}
    components: [tygbot]
    refresh: never

tygbot:
  id: tygbot_core
  require_auth: false
  host: ${device_name}.local

button:
  - platform: template
    name: Open Door 开门
    icon: mdi:door-open
    on_press:
      - lambda: id(tygbot_core).open(false);
  - platform: template
    name: Door Check 门禁检查（不开门）
    icon: mdi:connection
    entity_category: diagnostic
    on_press:
      - lambda: id(tygbot_core).open(true);
  - platform: safe_mode
    name: Safe Mode 安全模式重启
    entity_category: diagnostic
    # Recovery control is disabled by default.
    disabled_by_default: true
  - platform: template
    name: Refresh Call 重新获取对讲配置
    icon: mdi:phone-sync
    entity_category: config
    on_press:
      - lambda: id(tygbot_core).refresh_call();

binary_sensor:
  - platform: template
    name: Service Ready 服务就绪
    device_class: connectivity
    entity_category: diagnostic
    lambda: return id(tygbot_core).ready();
  - platform: template
    name: Logged In 桃园谷已登录
    icon: mdi:account-check
    lambda: return id(tygbot_core).logged_in();
  - platform: template
    name: Door Busy 开门处理中
    icon: mdi:progress-clock
    entity_category: diagnostic
    lambda: return id(tygbot_core).busy();
  - platform: template
    name: Door Call 门口机呼叫
    device_class: occupancy
    icon: mdi:doorbell
    lambda: return id(tygbot_core).call_ringing();
  - platform: template
    name: Call Registered 对讲已注册
    device_class: connectivity
    entity_category: diagnostic
    lambda: return id(tygbot_core).call_registered();

text_sensor:
  # Published only on change, so the API and log do not repeat unchanged text every 2 s.
  - platform: template
    id: tygbot_status
    name: Status 状态
    icon: mdi:information-outline
    lambda: |-
      const auto &v = id(tygbot_core).status();
      if (id(tygbot_status).has_state() && id(tygbot_status).state == v) return {};
      return v;
    update_interval: 2s
  - platform: template
    id: tygbot_last_door
    name: Last Door 最近开门结果
    icon: mdi:door
    lambda: |-
      const auto &v = id(tygbot_core).last_result();
      if (id(tygbot_last_door).has_state() && id(tygbot_last_door).state == v) return {};
      return v;
    update_interval: 2s
  - platform: template
    id: tygbot_caller
    name: Caller 呼叫来源
    icon: mdi:phone-incoming
    lambda: |-
      const auto &v = id(tygbot_core).caller();
      if (id(tygbot_caller).has_state() && id(tygbot_caller).state == v) return {};
      return v;
    update_interval: 2s
  - platform: template
    id: tygbot_call_status
    name: Call Status 对讲状态
    icon: mdi:phone-check
    entity_category: diagnostic
    lambda: |-
      const auto &v = id(tygbot_core).call_status();
      if (id(tygbot_call_status).has_state() && id(tygbot_call_status).state == v) return {};
      return v;
    update_interval: 2s

sensor:
  - platform: debug
    free:
      name: Free Heap 可用内存
    block:
      name: Largest Heap 最大连续内存
    min_free:
      name: Minimum Heap 最低可用内存
  - platform: uptime
    name: Uptime 运行时间
    entity_category: diagnostic
  - platform: wifi_signal
    name: Wi-Fi 信号
    entity_category: diagnostic
